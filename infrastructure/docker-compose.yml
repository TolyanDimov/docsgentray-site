services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ['3000:3000']
    depends_on: [backend]
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/docsgentray
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecret
    volumes:
      - ../license-service/keys:/run/secrets
    depends_on: [db, redis]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsgentray
    ports: ['5432:5432']
  redis:
    image: redis:7
    ports: ['6379:6379']
  telegram-bot:
    build:
      context: ../telegram-bot
      dockerfile: Dockerfile
    depends_on: [backend]
