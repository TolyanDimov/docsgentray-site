services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/docsgentray
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecret
      ADMIN_EMAIL: admin@example.com
      BOT_API_TOKEN: change-bot-api-token
    volumes:
      - ../license-service/keys:/run/secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsgentray
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d docsgentray']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  telegram-bot:
    build:
      context: ../telegram-bot
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
      BOT_API_TOKEN: change-bot-api-token
      BOT_TOKEN: CHANGE_ME
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
